<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bayazit Natur-Schule</title>
<meta name="theme-color" content="#0a0e13">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e13;--bg2:#0f151c;--panel:#121a23;--panel2:#17212c;--line:#223040;--tx:#e6edf3;--mu:#8b9bb0;--mono:'JetBrains Mono',ui-monospace,monospace;--sans:'Inter',system-ui,sans-serif;--acc:#22c55e;--shadow:0 10px 30px rgba(0,0,0,.35)}
html[data-theme=light]{--bg:#f3f5f8;--bg2:#e9edf2;--panel:#ffffff;--panel2:#f6f8fb;--line:#d9e0e8;--tx:#0f1720;--mu:#5b6b7f;--shadow:0 8px 24px rgba(15,23,32,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
.app{display:flex;min-height:100vh}
aside{display:none}
main{flex:1;min-width:0;max-width:1100px;margin:0 auto;padding:14px 14px 60px}
header.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,#22c55e33,#2dd4bf33);border:1px solid var(--line);flex:none}
.brand b{font-family:var(--mono);font-size:13px;letter-spacing:.08em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--mu);font-size:11.5px;font-family:var(--mono);letter-spacing:.05em}
.theme{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;flex:none}
.theme button{font-size:12px;padding:5px 8px;border-radius:7px;color:var(--mu);font-family:var(--mono);white-space:nowrap}
.theme button.on{background:var(--panel2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.theme .lbl{display:none}
@media(min-width:520px){.theme .lbl{display:inline}}
.hero{padding:6px 2px 14px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--acc);text-transform:uppercase}
h1{font-family:var(--mono);font-size:clamp(24px,6.5vw,38px);line-height:1.1;letter-spacing:-.01em;margin:6px 0 8px;font-weight:800}
.lead{color:var(--mu);max-width:640px}
.search{position:relative;margin:14px 0 4px}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 40px;color:var(--tx);font:inherit;outline:none}
.search input:focus{border-color:var(--acc)}
.search span{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.6}
.results{display:grid;gap:8px;margin-top:10px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.chip{font-family:var(--mono);font-size:11.5px;padding:5px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--mu)}
.chip b{color:var(--tx)}
.bento{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
@media(min-width:760px){.bento{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;overflow:hidden;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:168px;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--c)}
.tile::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 100% 0%,color-mix(in srgb,var(--c) 22%,transparent),transparent 60%);pointer-events:none}
.tile .ico{font-size:40px;line-height:1;margin-bottom:auto;position:relative}
.tile .no{position:absolute;top:12px;right:12px;font-family:var(--mono);font-size:10.5px;color:var(--c);letter-spacing:.1em}
.tile h3{font-family:var(--mono);font-size:15px;margin-top:12px;position:relative;line-height:1.2}
.tile p{font-size:12px;color:var(--mu);margin-top:4px;position:relative;line-height:1.35}
.bar{height:5px;border-radius:9px;background:var(--line);margin-top:10px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--c);border-radius:9px}
.prog{font-family:var(--mono);font-size:10.5px;color:var(--mu);margin-top:5px;position:relative}
.tile.big{grid-column:span 2}
.tile.big .ico{font-size:46px}
.back{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--mu);padding:7px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:12px}
.back:hover{color:var(--tx)}
.secthead{display:flex;gap:14px;align-items:center;margin:4px 0 14px}
.secthead .bigico{font-size:44px;width:68px;height:68px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));flex:none}
.secthead h1{font-size:clamp(22px,6vw,32px);margin:2px 0}
.warn{background:color-mix(in srgb,#ef4444 12%,var(--panel));border:1px solid color-mix(in srgb,#ef4444 45%,var(--line));border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13.5px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.cards{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1200px){.cards{grid-template-columns:repeat(4,1fr)}}
.card{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--c)}
.card .thumb{aspect-ratio:4/3;position:relative}
.card .meta{padding:10px 11px 12px}
.card .ln{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--c);display:flex;justify-content:space-between}
.card h4{font-size:14.5px;margin-top:3px;line-height:1.25}
.card small{color:var(--mu);font-style:italic;font-size:11.5px}
.seen{color:#22c55e;font-weight:700}
.ph{position:relative;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--c,#22c55e) 30%,var(--panel2)),var(--panel2));display:grid;place-items:center;width:100%;height:100%}
.ph .em{font-size:clamp(34px,10vw,64px);filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.ph img.ok{opacity:1}
.tag{position:absolute;left:8px;top:8px;font-family:var(--mono);font-size:10px;font-weight:700;padding:3px 7px;border-radius:7px;color:#fff;letter-spacing:.04em;z-index:2;text-transform:uppercase}
/* Lesson */
.lhead{margin-bottom:12px}
.lhead .ln{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--c)}
.lhead h1{font-size:clamp(22px,6vw,32px);margin:4px 0 0}
.lhead i{color:var(--mu);font-size:13px}
.player{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.stage{position:relative;aspect-ratio:16/11;background:radial-gradient(120% 90% at 80% 0%,color-mix(in srgb,var(--c) 22%,transparent),transparent 60%),var(--bg2);overflow:hidden}
@media(min-width:760px){.stage{aspect-ratio:16/9}}
.layer{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;opacity:0;pointer-events:none}
.layer.on{pointer-events:auto}
.layer:not(.L0){padding-top:74px}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-weight:700;font-size:clamp(11px,3.2vw,15px);padding:6px 11px;border-radius:999px;background:var(--panel);border:1.5px solid var(--c);color:var(--tx);box-shadow:var(--shadow);white-space:nowrap}
.pill.fill{background:var(--c);color:#0a0e13;border-color:var(--c)}
.L0 .frame{width:min(78%,520px);aspect-ratio:4/3;border-radius:16px;overflow:hidden;border:2px solid var(--c);box-shadow:0 18px 40px rgba(0,0,0,.4)}
.L0 .names{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.L0 .lat{font-family:var(--mono);font-size:11px;color:var(--mu);background:var(--panel);padding:3px 9px;border-radius:999px;border:1px solid var(--line);font-style:italic}
.mini{position:absolute;left:10px;top:10px;width:58px;height:58px;border-radius:12px;overflow:hidden;border:2px solid var(--c);z-index:5;opacity:0;transition:opacity .3s}
.mini .em{font-size:28px}
.ltitle{position:absolute;top:14px;right:14px;left:80px;text-align:right;font-family:var(--mono);font-size:clamp(11px,3vw,13px);letter-spacing:.12em;color:var(--c);text-transform:uppercase;font-weight:800}
.sizes{width:min(92%,640px);display:flex;flex-direction:column;gap:14px}
.srow .lab{font-family:var(--mono);font-size:12px;color:var(--mu);display:flex;justify-content:space-between;margin-bottom:5px;gap:8px}
.srow .lab b{color:var(--tx)}
.srow .trk{height:30px;border-radius:9px;background:color-mix(in srgb,var(--line) 60%,transparent);position:relative;overflow:hidden}
.srow .fil{position:absolute;left:0;top:0;bottom:0;border-radius:9px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:18px;min-width:30px}
.srow.me .fil{background:var(--c)}
.srow.ref .fil{background:color-mix(in srgb,var(--mu) 55%,transparent)}
.facts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.cloud{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:92%}
.cloud .pill{font-size:clamp(12px,3.6vw,17px);padding:9px 14px}
.bigq{font-size:clamp(40px,12vw,72px);line-height:1;margin-bottom:12px}
.factcard{max-width:min(92%,620px);background:var(--panel);border:2px solid var(--c);border-radius:16px;padding:16px 18px;font-size:clamp(14px,3.9vw,19px);font-weight:600;text-align:center;box-shadow:var(--shadow);line-height:1.4}
.factcard .ex{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--c);color:#0a0e13;font-family:var(--mono);font-weight:800;margin-bottom:8px}
/* intro */
.intro{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.intro .core{font-size:clamp(44px,13vw,80px);width:clamp(84px,22vw,130px);height:clamp(84px,22vw,130px);display:grid;place-items:center;border-radius:50%;background:var(--panel);border:2px solid var(--c);box-shadow:0 0 0 8px color-mix(in srgb,var(--c) 15%,transparent)}
.intro .plist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:94%}
.intro .pill{opacity:.25;transition:none}
.intro .pill.cur{border-width:2px}
.caption{padding:12px 14px 4px}
.caption .sn{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--c)}
.caption h3{font-size:16.5px;margin:2px 0 3px}
.caption p{color:var(--mu);font-size:14.5px;min-height:44px}
.ctrl{display:flex;align-items:center;gap:8px;padding:10px 12px 12px;flex-wrap:wrap}
.cbtn{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);font-size:16px;flex:none}
.cbtn.play{background:var(--c);color:#0a0e13;border-color:var(--c);font-size:17px}
input[type=range]{flex:1;min-width:110px;accent-color:var(--c);height:28px}
.spd{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.spd button{font-family:var(--mono);font-size:12px;padding:8px 9px;color:var(--mu)}
.spd button.on{background:var(--panel2);color:var(--tx)}
.steps{display:flex;gap:6px;padding:0 12px 14px;flex-wrap:wrap}
.steps button{font-family:var(--mono);font-size:12px;width:34px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--mu)}
.steps button.on{background:var(--c);color:#0a0e13;border-color:var(--c);font-weight:800}
.steps button.done{color:var(--tx)}
.boxes{display:grid;gap:10px;margin-top:14px}
@media(min-width:760px){.boxes{grid-template-columns:1fr 1fr}}
.box{border-radius:14px;padding:12px 14px;border:1px solid;background:var(--panel)}
.box h5{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.box p{font-size:14.5px}
.b1{border-color:color-mix(in srgb,#60a5fa 50%,var(--line));background:color-mix(in srgb,#60a5fa 8%,var(--panel))}.b1 h5{color:#60a5fa}
.b2{border-color:color-mix(in srgb,#22c55e 50%,var(--line));background:color-mix(in srgb,#22c55e 8%,var(--panel))}.b2 h5{color:#22c55e}
.b3{border-color:color-mix(in srgb,#eab308 50%,var(--line));background:color-mix(in srgb,#eab308 8%,var(--panel))}.b3 h5{color:#ca8a04}
.b4{border-color:color-mix(in srgb,#ef4444 50%,var(--line));background:color-mix(in srgb,#ef4444 8%,var(--panel))}.b4 h5{color:#ef4444}
html[data-theme=dark] .b3 h5{color:#eab308}
.credit{font-size:11.5px;color:var(--mu);margin-top:10px}
.credit a{color:var(--c)}
.nav2{display:flex;gap:10px;margin-top:16px}
.nav2 button{flex:1;padding:13px;border-radius:13px;border:1px solid var(--line);background:var(--panel);font-family:var(--mono);font-size:12.5px;text-align:center}
.nav2 button.nx{background:var(--c);color:#0a0e13;border-color:var(--c);font-weight:800}
.nav2 button:disabled{opacity:.35}
/* quiz */
.qwrap{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.qtop{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--mu);margin-bottom:10px}
.qbar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}.qbar i{display:block;height:100%;background:var(--c)}
.qimg{width:100%;max-width:480px;aspect-ratio:4/3;border-radius:14px;overflow:hidden;margin:0 auto 14px;border:2px solid var(--c)}
.qq{font-size:18px;font-weight:700;margin-bottom:12px;line-height:1.35}
.qq q{display:block;font-weight:500;font-size:15px;color:var(--mu);margin-top:8px;font-style:italic;quotes:"„" "“"}
.opts{display:grid;gap:8px}
@media(min-width:620px){.opts{grid-template-columns:1fr 1fr}}
.opt{padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);text-align:left;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.r{border-color:#22c55e;background:color-mix(in srgb,#22c55e 18%,var(--panel2))}
.opt.f{border-color:#ef4444;background:color-mix(in srgb,#ef4444 15%,var(--panel2))}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:14.5px}
.fb b{display:block;margin-bottom:3px}
.qact{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.qact button{flex:1;min-width:140px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-family:var(--mono);font-size:12.5px}
.qact .nx{background:var(--c);color:#0a0e13;border-color:var(--c);font-weight:800}
.score{font-family:var(--mono);font-size:56px;font-weight:800;text-align:center;color:var(--c);line-height:1}
.rep{display:grid;gap:8px;margin-top:12px}
.rep button{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);text-align:left}
.foot{margin-top:28px;font-size:11.5px;color:var(--mu);font-family:var(--mono);text-align:center}
.srch-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:left}
.srch-item .s{width:44px;height:44px;border-radius:10px;overflow:hidden;flex:none}
.srch-item .s .em{font-size:22px}
.srch-item small{color:var(--mu);font-size:11.5px;display:block}
/* sidebar desktop */
@media(min-width:1000px){
 aside{display:block;width:290px;flex:none;border-right:1px solid var(--line);background:var(--bg2);height:100vh;position:sticky;top:0;overflow:auto;padding:16px 12px}
 aside .search{margin:0 0 12px}
 aside .grp{font-family:var(--mono);font-size:11px;letter-spacing:.12em;margin:14px 6px 6px;display:flex;gap:6px;align-items:center;cursor:pointer}
 aside .it{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:9px;font-size:13.5px;color:var(--mu);text-align:left}
 aside .it:hover,aside .it.on{background:var(--panel);color:var(--tx)}
 aside .it .d{margin-left:auto;font-size:11px;color:#22c55e}
 main{padding:20px 28px 60px}
 .player,.boxes,.lhead,.nav2,.credit,.qwrap{max-width:860px}
 .hero .search{display:none}
}
</style>
</head>
<body>
<div class="app">
<aside id="side"></aside>
<main id="main"></main>
</div>
<script>
const CATS = [
{id:'saeuger', n:'Säugetiere', e:'🦊', c:'#f59e0b', d:'Fell, Milch für die Jungen – vom Igel bis zum Blauwal', fl:'Was frisst es?', hl:'Wo lebt es?',
 intro:{t:'Was ist ein Säugetier?', e:'🦊', pts:[

  {p:'Lungenatmung', t:'Alle Säugetiere atmen mit Lungen – auch Wale und Delfine müssen zum Atmen auftauchen.'},

 items:[
 {n:'Rotfuchs', l:'Vulpes vulpes', w:'Rotfuchs', e:'🦊', s:70, sl:'Körperlänge', g:'5–8 kg', a:'meist 2–4 Jahre', h:['🌲 Wald','🌾 Feld','🏘️ Stadtrand'], f:['🐭 Mäuse','🪱 Regenwürmer','🫐 Beeren','🗑️ Abfälle'],

 {n:'Eichhörnchen', l:'Sciurus vulgaris', w:'Eurasisches Eichhörnchen', e:'🐿️', s:23, sl:'Körperlänge (ohne Schwanz)', g:'250–350 g', a:'meist 3–4 Jahre', h:['🌲 Wald','🌳 Parks','🏡 Gärten'], f:['🌰 Nüsse','🌲 Zapfensamen','🍄 Pilze','🌱 Knospen'],
  x:'Es versteckt im Herbst Tausende Nüsse – viele findet es nie wieder. Daraus wachsen neue Bäume!',
  d:'Das Eichhörnchen ist ein flinker Kletterer, der in einem kugeligen Nest aus Zweigen wohnt, dem „Kobel“.',
  erk:'Rotbraunes bis fast schwarzes Fell, heller Bauch, buschiger Schwanz und im Winter Haarpinsel an den Ohren.',
  bed:'Als „Gärtner des Waldes“ pflanzt es mit vergessenen Vorräten unabsichtlich neue Bäume.',
  tipp:'Eichhörnchen halten keinen Winterschlaf, nur Winterruhe – an milden Tagen siehst du sie auch im Winter.'},
 {n:'Reh', l:'Capreolus capreolus', w:'Reh', e:'🦌', s:120, sl:'Körperlänge', g:'15–30 kg', a:'meist 5–8 Jahre', h:['🌲 Waldrand','🌾 Wiesen','🌿 Felder'], f:['🌱 Knospen','🍃 Blätter','🌼 Kräuter'],
  x:'Nur der Rehbock trägt ein Geweih. Er wirft es jedes Jahr im Herbst ab und bildet ein neues.',
  d:'Das Reh ist das häufigste Wildtier mit Geweih in Deutschland und kleiner als der Rothirsch.',
  erk:'Rotbraunes Sommerfell, graues Winterfell, großer weißer Fleck am Hinterteil („Spiegel“), schlanke Beine.',
  bed:'Rehe gehören zum Wald – zu viele Rehe fressen aber junge Bäume an, deshalb wird ihre Zahl geregelt.',
  tipp:'Findest du im Mai oder Juni ein Rehkitz im Gras: nicht anfassen! Die Mutter kommt zurück.'},
 {n:'Wildschwein', l:'Sus scrofa', w:'Wildschwein', e:'🐗', s:150, sl:'Körperlänge', g:'50–150 kg', a:'meist 5–10 Jahre', h:['🌲 Laubwald','🌽 Felder','🌾 Wiesen'], f:['🌰 Eicheln','🌽 Mais','🪱 Würmer','🍄 Pilze'],
  x:'Wildschweine riechen extrem gut – sie finden Futter, das tief in der Erde vergraben ist.',
  d:'Das Wildschwein ist ein Allesfresser und lebt in Gruppen, den „Rotten“, angeführt von einer erfahrenen Mutter (Bache).',
  erk:'Dunkles, borstiges Fell, lange Schnauze mit Rüssel, Männchen (Keiler) mit Hauern. Junge (Frischlinge) sind gestreift.',
  bed:'Beim Wühlen lockern sie den Waldboden auf – das hilft Samen beim Keimen.',
  tipp:'Eine Bache mit Frischlingen nie stören – ruhig zurückgehen und großen Abstand halten.'},
 {n:'Afrikanischer Elefant', l:'Loxodonta africana', w:'Afrikanischer Elefant', e:'🐘', s:350, sl:'Schulterhöhe', g:'bis 6 Tonnen', a:'60–70 Jahre', h:['🌍 Savanne','🌳 Wälder Afrikas'], f:['🌿 Gras','🍃 Blätter','🌳 Rinde','🍎 Früchte'],
  x:'Er ist das größte Landtier der Welt und frisst bis zu 150 kg Pflanzen am Tag.',
  d:'Der Afrikanische Elefant lebt in Familiengruppen, die von der ältesten Elefantenkuh geführt werden.',
  erk:'Riesige Ohren (geformt wie der Umriss Afrikas), langer Rüssel, Stoßzähne bei Männchen und Weibchen.',
  bed:'Elefanten trampeln Wege, verteilen Samen mit ihrem Kot und graben Wasserlöcher – sie formen ganze Landschaften.',
  tipp:'Mit den großen Ohren fächeln sie sich Luft zu und kühlen so ihr Blut.'},
 {n:'Löwe', l:'Panthera leo', w:'Löwe', e:'🦁', s:200, sl:'Körperlänge (Männchen)', g:'bis 190 kg', a:'10–14 Jahre', h:['🌍 Savanne','🌾 Grasland'], f:['🦓 Zebras','🐃 Büffel','🦌 Antilopen'],
  x:'Das Brüllen eines Löwen ist bis zu 8 Kilometer weit zu hören.',
  d:'Der Löwe ist die einzige Raubkatze, die in Gruppen lebt – dem Rudel.',
  erk:'Sandfarbenes Fell, Männchen mit großer Mähne, Quaste am Schwanzende.',
  bed:'Als Spitzenjäger halten Löwen die Zahl der Pflanzenfresser im Gleichgewicht.',
  tipp:'Meist jagen die Weibchen. Löwen schlafen bis zu 20 Stunden am Tag.'},
 {n:'Blauwal', l:'Balaenoptera musculus', w:'Blauwal', e:'🐋', s:3000, sl:'Länge (max.)', g:'bis über 150 Tonnen', a:'80–90 Jahre', h:['🌊 Alle Ozeane'], f:['🦐 Krill (kleine Krebse)'],
  x:'Der Blauwal ist das größte Tier, das je gelebt hat – größer als jeder Dinosaurier.',
  d:'Der Blauwal ist ein Säugetier: Er atmet Luft und säugt seine Jungen mit Milch.',
  erk:'Blaugraue, gefleckte Haut, sehr langer schlanker Körper, kleine Rückenflosse weit hinten, bis 9 m hoher Blas.',
  bed:'Sein Kot düngt das Meer und lässt Plankton wachsen – das ist gut für das ganze Meeresleben.',
  tipp:'Er frisst mehrere Tonnen Krill am Tag, obwohl die Tierchen nur wenige Zentimeter groß sind.'}
 ]},
{id:'voegel', n:'Vögel', e:'🦅', c:'#60a5fa', d:'Federn, Schnabel, Eier – Gartenvögel bis Pinguin', fl:'Was frisst es?', hl:'Wo lebt es?',
 intro:{t:'Was ist ein Vogel?', e:'🦅', pts:[
  {p:'Federn', t:'Nur Vögel haben Federn. Sie wärmen und machen das Fliegen möglich.'},
  {p:'Schnabel ohne Zähne', t:'Vögel haben einen Schnabel aus Horn – seine Form verrät, was der Vogel frisst.'},
  {p:'Eier mit Kalkschale', t:'Alle Vögel legen Eier mit harter Schale und brüten sie meist aus.'},
  {p:'Leichte Knochen', t:'Viele Knochen sind hohl und mit Luft gefüllt – das spart Gewicht beim Fliegen.'},
  {p:'Gleichwarm', t:'Vögel haben eine hohe Körpertemperatur von etwa 40 °C.'}]},
 items:[
 {n:'Amsel', l:'Turdus merula', w:'Amsel', e:'🐦', s:25, sl:'Körperlänge', g:'80–110 g', a:'meist 3–5 Jahre', h:['🏡 Gärten','🌳 Parks','🌲 Wald'], f:['🪱 Regenwürmer','🐛 Insekten','🫐 Beeren'],
  x:'Amseln singen oft schon vor Sonnenaufgang – in Städten manchmal sogar nachts bei Laternenlicht.',
  d:'Die Amsel ist einer der häufigsten Vögel Deutschlands und eine Drossel.',
  erk:'Männchen ganz schwarz mit leuchtend gelbem Schnabel, Weibchen dunkelbraun.',
  bed:'Sie frisst viele Schnecken und Insekten und verbreitet mit Beeren die Samen von Sträuchern.',
  tipp:'Achte auf Amseln, die mit schräg gelegtem Kopf auf dem Rasen nach Würmern lauschen.'},
 {n:'Kohlmeise', l:'Parus major', w:'Kohlmeise', e:'🐦', s:14, sl:'Körperlänge', g:'ca. 18 g', a:'meist 2–3 Jahre', h:['🏡 Gärten','🌲 Wald','🌳 Parks'], f:['🐛 Raupen','🕷️ Spinnen','🌻 Samen'],
  x:'Ein Meisenpaar verfüttert an seine Jungen viele Tausend Raupen – ein echter Schädlingsbekämpfer.',
  d:'Die Kohlmeise ist die größte und häufigste Meise in Europa.',
  erk:'Gelber Bauch mit schwarzem Längsstreifen („Krawatte“), schwarzer Kopf, weiße Wangen. Ruf: „zi-zi-bä“.',
  bed:'Sie hält Raupen in Gärten und Obstplantagen in Schach.',
  tipp:'Mit einem Nistkasten (Loch 32 mm) holst du dir Kohlmeisen in den Garten.'},
 {n:'Rotkehlchen', l:'Erithacus rubecula', w:'Rotkehlchen', e:'🐦', s:14, sl:'Körperlänge', g:'16–22 g', a:'meist 1–2 Jahre', h:['🏡 Gärten','🌲 Unterholz','🌳 Hecken'], f:['🐛 Insekten','🕷️ Spinnen','🪱 Würmer','🫐 Beeren'],
  x:'Rotkehlchen singen auch im Winter – und verteidigen ihr Revier mit Gesang.',

  erk:'Orangerote Brust und Gesicht, olivbrauner Rücken, große dunkle Augen.',
  bed:'Es frisst viele Insekten und Spinnen im Garten.',
  tipp:'Beim Umgraben im Garten folgt dir das Rotkehlchen oft und schnappt sich freigelegte Würmer.'},
 {n:'Weißstorch', l:'Ciconia ciconia', w:'Weißstorch', e:'🪶', s:210, sl:'Flügelspannweite', g:'3–4 kg', a:'bis über 20 Jahre', h:['🌾 Feuchtwiesen','🏘️ Dächer & Kirchtürme'], f:['🐸 Frösche','🐭 Mäuse','🦗 Insekten','🪱 Regenwürmer'],
  x:'Störche sind Zugvögel: Im Herbst fliegen viele bis nach Afrika – Tausende Kilometer weit.',
  d:'Der Weißstorch ist ein großer Schreitvogel, der seine Nester gern auf Dächern baut.',
  erk:'Weißes Gefieder, schwarze Flügelfedern, langer roter Schnabel und rote Beine.',
  bed:'Er zeigt gesunde Feuchtwiesen an, denn nur dort findet er genug Nahrung.',
  tipp:'Störche können kaum singen – sie „klappern“ laut mit dem Schnabel.'},
 {n:'Mäusebussard', l:'Buteo buteo', w:'Mäusebussard', e:'🦅', s:120, sl:'Flügelspannweite', g:'0,5–1,2 kg', a:'bis über 20 Jahre', h:['🌾 Felder','🌲 Waldrand'], f:['🐭 Mäuse','🐸 Frösche','🪱 Regenwürmer'],
  x:'Er ist der häufigste Greifvogel Deutschlands – oft sitzt er an Autobahnen auf Zaunpfählen.',
  d:'Der Mäusebussard ist ein mittelgroßer Greifvogel, der über Feldern kreist.',
  erk:'Braun mit sehr unterschiedlich hellem Bauch, breite runde Flügel, kurzer gefächerter Schwanz, Ruf „hiääh“.',
  bed:'Er frisst sehr viele Mäuse und hilft damit der Landwirtschaft.',
  tipp:'Schau bei Autofahrten auf Pfähle am Straßenrand – dort lauert er gern.'},
 {n:'Uhu', l:'Bubo bubo', w:'Uhu', e:'🦉', s:170, sl:'Flügelspannweite', g:'2–3 kg', a:'bis über 20 Jahre', h:['⛰️ Felsen','🌲 Wald','🏭 Steinbrüche'], f:['🐭 Mäuse','🐇 Kaninchen','🐦 Vögel'],
  x:'Der Uhu ist die größte Eule Europas. Dank weicher Federn fliegt er fast lautlos.',
  d:'Der Uhu ist ein nachtaktiver Greifvogel mit riesigen Augen.',
  erk:'Große Federohren, leuchtend orangefarbene Augen, braun gemustertes Gefieder, Ruf „uhu“.',
  bed:'Als großer Jäger steht er ganz oben in der Nahrungskette.',
  tipp:'Federohren sind keine Ohren – die echten Ohren liegen versteckt seitlich am Kopf.'},
 {n:'Eisvogel', l:'Alcedo atthis', w:'Eisvogel', e:'🐦', s:16, sl:'Körperlänge', g:'35–40 g', a:'meist 1–2 Jahre', h:['🏞️ Bäche','💧 Seen','🌊 Flüsse'], f:['🐟 Kleine Fische','🦐 Wasserinsekten'],
  x:'Er stürzt sich kopfüber ins Wasser und schnappt kleine Fische – in Sekundenbruchteilen.',
  d:'Der Eisvogel ist einer der buntesten Vögel Europas und wird „fliegender Edelstein“ genannt.',
  erk:'Leuchtend blauer Rücken, orangefarbener Bauch, langer spitzer Schnabel, kurzer Schwanz.',
  bed:'Er zeigt sauberes Wasser mit vielen Fischen an.',
  tipp:'Er brütet in selbst gegrabenen Röhren in steilen, sandigen Uferwänden.'},
 {n:'Kaiserpinguin', l:'Aptenodytes forsteri', w:'Kaiserpinguin', e:'🐧', s:120, sl:'Körperhöhe', g:'22–45 kg', a:'ca. 20 Jahre', h:['🧊 Antarktis','🌊 Südpolarmeer'], f:['🐟 Fische','🦑 Tintenfische','🦐 Krill'],
  x:'Das Männchen brütet das Ei rund zwei Monate auf seinen Füßen aus – im antarktischen Winter, ohne zu fressen.',
  d:'Der Kaiserpinguin ist der größte Pinguin der Welt. Er kann nicht fliegen, aber hervorragend tauchen.',
  erk:'Schwarzer Rücken, weißer Bauch, gelb-orange Flecken an den Ohren und an der Brust.',
  bed:'Er ist ein wichtiger Teil des antarktischen Nahrungsnetzes.',
  tipp:'Kaiserpinguine tauchen über 500 Meter tief – tiefer als jeder andere Vogel.'}
 ]},
{id:'fische', n:'Fische', e:'🐟', c:'#2dd4bf', d:'Kiemen, Flossen, Schuppen – Bach, See und Meer', fl:'Was frisst er?', hl:'Wo lebt er?',
 intro:{t:'Was ist ein Fisch?', e:'🐟', pts:[

 items:[

 {n:'Hecht', l:'Esox lucius', w:'Hecht', e:'🐟', s:100, sl:'Länge', g:'2–15 kg', a:'10–20 Jahre', h:['🏞️ Seen','🌿 Pflanzenreiche Ufer','🌊 Flüsse'], f:['🐟 Fische','🐸 Frösche'],

{id:'reptilien', n:'Reptilien & Amphibien', e:'🐸', c:'#a3e635', d:'Echsen, Schlangen, Frösche, Molche', fl:'Was frisst es?', hl:'Wo lebt es?',
 intro:{t:'Reptil oder Amphibie?', e:'🐸', pts:[

 items:[
 {n:'Zauneidechse', l:'Lacerta agilis', w:'Zauneidechse', e:'🦎', s:20, sl:'Gesamtlänge', g:'10–20 g', a:'bis ca. 10 Jahre', h:['☀️ Sonnige Böschungen','🛤️ Bahndämme','🌾 Heide'], f:['🦗 Insekten','🕷️ Spinnen','🐛 Raupen'],
  x:'Bei Gefahr wirft sie ihren Schwanz ab. Er zappelt weiter und lenkt den Feind ab – und wächst kürzer nach.',
  d:'Die Zauneidechse ist eine heimische Echse, die sich gern in der Sonne aufwärmt.',
  erk:'Braunes Rückenband mit hellen Flecken, Männchen im Frühjahr mit leuchtend grünen Flanken.',
  bed:'Sie ist streng geschützt und zeigt sonnige, naturnahe Flächen an.',
  tipp:'Steinhaufen und Totholz im Garten bieten Eidechsen Verstecke.'},
 {n:'Ringelnatter', l:'Natrix natrix', w:'Ringelnatter', e:'🐍', s:100, sl:'Länge', g:'bis 250 g', a:'bis 20 Jahre', h:['💧 Teiche','🌿 Feuchtwiesen','🏞️ Ufer'], f:['🐸 Frösche','🐟 Kleine Fische','🦎 Molche'],

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const slug=s=>s.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
// build lessons
const ALL=[];
CATS.forEach((c,ci)=>{c.lessons=[];
 const intro={type:'intro',cat:c,id:c.id+'-grundlagen',n:c.intro.t,e:c.intro.e};c.lessons.push(intro);
 c.items.forEach(it=>{it.type='sp';it.cat=c;it.id=c.id+'-'+slug(it.n);c.lessons.push(it);ALL.push(it)});
 c.lessons.forEach((l,i)=>l.idx=i);
});
const byId={};CATS.forEach(c=>c.lessons.forEach(l=>byId[l.id]=l));
let seen=new Set(LS.get('natur_seen',[]));
const markSeen=id=>{if(!seen.has(id)){seen.add(id);LS.set('natur_seen',[...seen]);renderSide()}};
const fmtN=(v,d=1)=>v.toLocaleString('de-DE',{maximumFractionDigits:d});
const fmtSize=cm=>cm>=100?fmtN(cm/100)+' m':(cm<1?fmtN(cm*10)+' mm':fmtN(cm)+' cm');

/* ---------- Theme ---------- */
const mq=window.matchMedia?matchMedia('(prefers-color-scheme: light)'):null;
let themePref=LS.get('natur_theme','dark');
function applyTheme(){const t=themePref==='auto'?(mq&&mq.matches?'light':'dark'):themePref;document.documentElement.setAttribute('data-theme',t);document.querySelectorAll('.theme button').forEach(b=>b.classList.toggle('on',b.dataset.t===themePref));const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='light'?'#f3f5f8':'#0a0e13'}
mq&&mq.addEventListener&&mq.addEventListener('change',applyTheme);
window.setTheme=t=>{themePref=t;LS.set('natur_theme',t);applyTheme()};
const themeHTML=`<div class="theme" role="group" aria-label="Darstellung"><button data-t="dark" onclick="setTheme('dark')">☾<span class="lbl"> Dunkel</span></button><button data-t="light" onclick="setTheme('light')">☀<span class="lbl"> Hell</span></button><button data-t="auto" onclick="setTheme('auto')">◐<span class="lbl"> Auto</span></button></div>`;

/* ---------- Bilder (Wikipedia) ---------- */
const imgCache=LS.get('natur_img',{});const pending={};
function getImg(title){
 if(title in imgCache)return Promise.resolve(imgCache[title]);
 if(pending[title])return pending[title];
 pending[title]=new Promise(res=>{
  let done=false;const fin=v=>{if(done)return;done=true;if(v!==undefined){imgCache[title]=v;LS.set('natur_img',imgCache)}res(v||null)};
  setTimeout(()=>fin(undefined),7000);
  try{fetch('https://de.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title.replace(/ /g,'_'))).then(r=>r.ok?r.json():null).then(j=>{
   if(!j){fin(null);return}
   let u=(j.thumbnail&&j.thumbnail.source)||(j.originalimage&&j.originalimage.source)||null;
   if(u&&j.thumbnail&&/\/\d+px-/.test(u)){const ow=j.originalimage&&j.originalimage.width||9999;if(ow>640)u=u.replace(/\/\d+px-/,'/640px-')}
   fin(u)}).catch(()=>fin(undefined))}catch(e){fin(undefined)}
 });
 return pending[title];
}
function phHTML(sp,cls=''){return `<div class="ph ${cls}" data-w="${esc(sp.w||'')}"><span class="em">${sp.e}</span><img alt="${esc(sp.n)}" referrerpolicy="no-referrer"></div>`}
function hydrate(root){(root||document).querySelectorAll('.ph[data-w]:not([data-h])').forEach(el=>{el.setAttribute('data-h','1');const w=el.dataset.w;if(!w)return;getImg(w).then(u=>{if(!u)return;const im=el.querySelector('img');im.onload=()=>{im.classList.add('ok');const e=el.querySelector('.em');if(e)e.style.opacity=0};im.onerror=()=>{};im.src=u})})}

/* ---------- Sidebar ---------- */
function renderSide(){
 const s=$('#side');const cur=location.hash.slice(1);
 let h=`<div class="search"><span>🔍</span><input id="sq" placeholder="Art suchen …" autocomplete="off"></div><div id="sres" class="results"></div>`;
 CATS.forEach(c=>{const n=c.lessons.filter(l=>seen.has(l.id)).length;
  h+=`<div class="grp" style="color:${c.c}" onclick="go('b-${c.id}')">${c.e} ${esc(c.n.toUpperCase())} <span style="margin-left:auto;color:var(--mu)">${n}/${c.lessons.length}</span></div>`;
  c.lessons.forEach(l=>{h+=`<button class="it ${cur==='l-'+l.id?'on':''}" onclick="go('l-${l.id}')">${l.type==='intro'?'📖':l.e} ${esc(l.n)}${seen.has(l.id)?'<span class="d">✓</span>':''}</button>`})});
 h+=`<div class="grp" style="color:#a78bfa" onclick="go('quiz')">🎯 QUIZ</div>`;
 const old=s.querySelector('#sq');const val=old?old.value:'';
 s.innerHTML=h;const q=s.querySelector('#sq');q.value=val;q.oninput=()=>searchInto(q.value,s.querySelector('#sres'));if(val)searchInto(val,s.querySelector('#sres'));
}
function searchInto(q,el){q=q.trim().toLowerCase();if(!q){el.innerHTML='';return}
 const r=ALL.filter(s=>(s.n+' '+s.l+' '+s.cat.n+' '+s.w).toLowerCase().includes(q)).slice(0,12);
 el.innerHTML=r.length?r.map(s=>`<button class="srch-item" style="--c:${s.cat.c}" onclick="go('l-${s.id}')"><div class="s">${phHTML(s)}</div><div><b>${esc(s.n)}</b><small>${esc(s.cat.n)} · <i>${esc(s.l)}</i></small></div></button>`).join(''):`<div class="chip">Nichts gefunden</div>`;hydrate(el)}

/* ---------- Router ---------- */
window.go=h=>{if(location.hash.slice(1)===h)route();else location.hash=h;};
let player=null;
function route(){
 if(player){player.stop();player=null}
 const h=location.hash.slice(1);
 if(h.startsWith('b-')&&CATS.find(c=>c.id===h.slice(2)))renderCat(CATS.find(c=>c.id===h.slice(2)));
 else if(h.startsWith('l-')&&byId[h.slice(2)])renderLesson(byId[h.slice(2)]);
 else if(h==='quiz')renderQuizStart();
 else renderHome();
 renderSide();applyTheme();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
const head=()=>`<header class="top"><div class="brand" onclick="go('start')"><div class="logo">🌿</div><div><b>BAYAZIT NATUR-SCHULE</b><small>TIERE · PFLANZEN · PILZE</small></div></div>${themeHTML}</header>`;

/* ---------- Home ---------- */
function renderHome(){
 const tot=CATS.reduce((a,c)=>a+c.lessons.length,0);const best=LS.get('natur_best',0);
 let h=head()+`<section class="hero" style="--acc:#22c55e"><div class="kicker">// Lern-App</div><h1>Natur entdecken.</h1><p class="lead">${ALL.length} Arten in ${CATS.length} Bereichen – mit echten Fotos, kleinen Erklär-Videos und einem Quiz.</p>
 <div class="search"><span>🔍</span><input id="hq" placeholder="Art suchen, z. B. Fuchs, Eiche, Pilz …" autocomplete="off"></div><div id="hres" class="results"></div>
 <div class="stats"><span class="chip">Gesehen <b>${[...seen].filter(i=>byId[i]).length}/${tot}</b></span><span class="chip">Quiz-Bestwert <b>${best}/10</b></span></div></section><div class="bento">`;
 CATS.forEach((c,i)=>{const n=c.lessons.filter(l=>seen.has(l.id)).length;
  h+=`<button class="tile" style="--c:${c.c}" onclick="go('b-${c.id}')"><span class="no">0${i+1}</span><span class="ico">${c.e}</span><h3>${esc(c.n)}</h3><p>${esc(c.d)}</p><div class="bar"><i style="width:${n/c.lessons.length*100}%"></i></div><div class="prog">${n}/${c.lessons.length}</div></button>`});
 h+=`<button class="tile big" style="--c:#a78bfa" onclick="go('quiz')"><span class="no">QUIZ</span><span class="ico">🎯</span><h3>Natur-Quiz</h3><p>10 zufällige Fragen: Fotos erkennen, Wissen, Rechnen. Bestwert: ${best}/10</p></button></div>
 <div class="foot">Fotos: Wikipedia / Wikimedia Commons · Bayazit Natur-Schule</div>`;
 $('#main').innerHTML=h;const q=$('#hq');q.oninput=()=>searchInto(q.value,$('#hres'));
}

/* ---------- Bereich ---------- */
function renderCat(c){
 const ci=CATS.indexOf(c);
 let h=head()+`<button class="back" onclick="go('start')">← Startseite</button><div class="secthead" style="--c:${c.c}"><div class="bigico">${c.e}</div><div><div class="kicker" style="color:${c.c}">BEREICH 0${ci+1}</div><h1>${esc(c.n)}</h1><div class="lead" style="font-size:13.5px">${esc(c.d)}</div></div></div>`;
 if(c.id==='pilze')h+=`<div class="warn">⚠️ <b>Wichtig:</b> Pilze niemals nur mit einer App bestimmen und essen! Im Zweifel immer zu einer Pilzberatung (Pilzsachverständige der DGfM) gehen.</div>`;
 if(c.id==='blumen')h+=`<div class="warn">⚠️ Manche Pflanzen sind giftig. Nur essen, was du ganz sicher kennst.</div>`;
 h+=`<div class="cards" style="--c:${c.c}">`;
 c.lessons.forEach((l,i)=>{
  const tg=l.tag?`<span class="tag" style="background:${l.tag.c}">${esc(l.tag.t)}</span>`:'';
  const th=l.type==='intro'?`<div class="ph"><span class="em">📖</span></div>`:phHTML(l);
  h+=`<button class="card" onclick="go('l-${l.id}')"><div class="thumb">${tg}${th}</div><div class="meta"><div class="ln"><span>LEKTION ${i+1}</span>${seen.has(l.id)?'<span class="seen">✓</span>':''}</div><h4>${esc(l.n)}</h4><small>${l.type==='intro'?'Grundlagen':esc(l.l)}</small></div></button>`});

}

/* ---------- Lektion / Video ---------- */
const STEP=3600;
function refFor(sp){const s=sp.s;if(sp.cat.id==='baeume')return{n:'Einfamilienhaus',a:'ein',e:'🏠',s:1000};if(s<=30)return{n:'Erwachsenen-Hand',a:'eine',e:'✋',s:18};if(s<=700)return{n:'Mensch',a:'ein',e:'🧍',s:180};return{n:'Schulbus',a:'ein',e:'🚌',s:1200}}
function sizeText(sp){const r=refFor(sp);const q=sp.s/r.s;
 if(q>=1.4)return `${sp.sl}: etwa ${fmtSize(sp.s)}. Das ist rund ${fmtN(q,q<10?1:0)}-mal so groß wie ${r.a} ${r.n} (${fmtSize(r.s)}).`;
 if(q<=0.7)return `${sp.sl}: etwa ${fmtSize(sp.s)}. ${r.a[0].toUpperCase()+r.a.slice(1)} ${r.n} (${fmtSize(r.s)}) ist rund ${fmtN(1/q,1/q<10?1:0)}-mal so groß.`;
 return `${sp.sl}: etwa ${fmtSize(sp.s)} – ungefähr so groß wie ${r.a} ${r.n} (${fmtSize(r.s)}).`}
function stepsFor(l){
 if(l.type==='intro')return l.cat.intro.pts.map(p=>({t:p.p,x:p.t}));
 return [{t:'Das ist: '+l.n,x:l.d},{t:'Wie groß?',x:sizeText(l)},{t:l.cat.hl,x:l.h.map(s=>s.replace(/^\S+\s/,'')).join(', ')+'.'},{t:l.cat.fl,x:l.f.map(s=>s.replace(/^\S+\s/,'')).join(', ')+'.'},{t:'Wusstest du?',x:l.x}];
}
function stageHTML(l){
 const c=l.cat;
 if(l.type==='intro'){return `<div class="layer on" id="Li" style="opacity:1"><div class="intro"><div class="core">${l.e}</div><div class="plist">${c.intro.pts.map((p,i)=>`<span class="pill" data-i="${i}">${esc(p.p)}</span>`).join('')}</div></div></div>`}
 const r=refFor(l);const mx=Math.max(l.s,r.s);
 const facts=[l.g?`⚖️ ${l.g}`:'',l.a?`⏳ ${l.a}`:''].filter(Boolean).map(f=>`<span class="pill">${esc(f)}</span>`).join('');
 return `<div class="mini" id="mini">${phHTML(l)}</div>
 <div class="layer L0" data-k="0"><div class="frame">${phHTML(l)}</div><div class="names"><span class="pill fill">${esc(l.n)}</span><span class="lat">${esc(l.l)}</span></div></div>
 <div class="layer" data-k="1"><div class="ltitle">Wie groß?</div><div class="sizes">
  <div class="srow me"><div class="lab"><b>${esc(l.n)}</b><span>${fmtSize(l.s)}</span></div><div class="trk"><div class="fil" data-w="${l.s/mx*100}">${l.e}</div></div></div>
  <div class="srow ref"><div class="lab"><b>${r.n}</b><span>${fmtSize(r.s)}</span></div><div class="trk"><div class="fil" data-w="${r.s/mx*100}">${r.e}</div></div></div>
  <div class="facts">${facts}</div></div></div>
 <div class="layer" data-k="2"><div class="ltitle">${esc(c.hl)}</div><div class="bigq">📍</div><div class="cloud">${l.h.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div></div>
 <div class="layer" data-k="3"><div class="ltitle">${esc(c.fl)}</div><div class="bigq">${c.id==='baeume'?'🍃':c.id==='blumen'?'🌼':c.id==='pilze'?'🧺':'🍽️'}</div><div class="cloud">${l.f.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div></div>
 <div class="layer" data-k="4"><div class="ltitle">Wusstest du?</div><div class="factcard"><div class="ex">!</div><div>${esc(l.x)}</div></div></div>`;
}
const ease=p=>1-Math.pow(1-p,3);const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
function Player(l){
 const st=stepsFor(l);const N=st.length;const total=N*STEP;
 let t=0,playing=true,speed=1,last=null,raf=0,lastK=-1;
 const stage=$('#stage');stage.innerHTML=stageHTML(l);hydrate(stage);
 const rng=$('#rng');rng.max=total;
 const stepsEl=$('#steps');stepsEl.innerHTML=st.map((s,i)=>`<button data-k="${i}">${i+1}</button>`).join('');
 stepsEl.onclick=e=>{const b=e.target.closest('button');if(!b)return;t=+b.dataset.k*STEP+1;draw()};
 const playB=$('#play');
 function draw(){
  const k=Math.min(N-1,Math.floor(t/STEP));const p=cl((t-k*STEP)/900);const e=ease(p);
  if(l.type==='intro'){stage.querySelectorAll('.intro .pill').forEach(el=>{const i=+el.dataset.i;let o=i<k?1:i===k?.25+.75*e:.22;el.style.opacity=o;el.classList.toggle('fill',i===k);el.style.transform=i===k?`scale(${1+.08*Math.sin(Math.PI*p)})`:'none'});
   const core=stage.querySelector('.core');core.style.transform=`scale(${1+.05*Math.sin(Math.PI*p)})`}
  else{
   stage.querySelectorAll('.layer').forEach(L=>{const kk=+L.dataset.k;const on=kk===k;L.classList.toggle('on',on);L.style.opacity=on?e:0;L.style.transform=on?`translateY(${(1-e)*14}px)`:'none'});
   const mini=$('#mini');if(mini)mini.style.opacity=k>0?1:0;
   if(k===0){const f=stage.querySelector('.L0 .frame');f.style.transform=`scale(${1.12-.12*e})`}
   if(k===1){stage.querySelectorAll('.srow .fil').forEach((f,i)=>{const pp=ease(cl(((t-k*STEP)-200-i*350)/1300));f.style.width=`calc(${(+f.dataset.w)*pp}% )`})}
   if(k===2||k===3){const L=stage.querySelector(`.layer[data-k="${k}"]`);L.querySelectorAll('.cloud .pill').forEach((el,i)=>{const pp=ease(cl(((t-k*STEP)-300-i*380)/500));el.style.opacity=pp;el.style.transform=`scale(${.7+.3*pp})`})}
  }
  if(k!==lastK){lastK=k;$('#cap').innerHTML=`<div class="sn">SCHRITT ${k+1} / ${N}</div><h3>${esc(st[k].t)}</h3><p>${esc(st[k].x)}</p>`}
  stepsEl.querySelectorAll('button').forEach((b,i)=>{b.classList.toggle('on',i===k);b.classList.toggle('done',i<k)});
  rng.value=t;playB.textContent=playing?'❚❚':'▶';
 }
 function loop(ts){if(last==null)last=ts;const dt=ts-last;last=ts;if(playing){t+=dt*speed;if(t>=total){t=total-1;playing=false;markSeen(l.id)}}draw();raf=requestAnimationFrame(loop)}
 playB.onclick=()=>{if(!playing&&t>=total-2)t=0;playing=!playing};
 $('#rst').onclick=()=>{t=0;playing=true};
 rng.oninput=()=>{t=+rng.value;draw()};
 document.querySelectorAll('.spd button').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.spd button').forEach(x=>x.classList.toggle('on',x===b))});
 raf=requestAnimationFrame(loop);
 return{stop(){cancelAnimationFrame(raf)}};
}
function renderLesson(l){
 const c=l.cat;const i=l.idx;const prev=c.lessons[i-1],next=c.lessons[i+1];
 const boxes=l.type==='intro'?
  [['b1','Was ist das?',c.intro.pts[0].t],['b2','So erkennst du es',c.intro.pts.slice(0,3).map(p=>p.p).join(' · ')],['b3','Was bedeutet es?',c.intro.pts[3].t],['b4','Tipp',c.intro.pts[4].t]]:
  [['b1','Was ist das?',l.d],['b2','So erkennst du es',l.erk],['b3','Warum ist es wichtig?',l.bed],['b4','Tipp',l.tipp]];
 let h=head()+`<button class="back" onclick="go('b-${c.id}')">← ${esc(c.n)}</button>
 <div class="lhead" style="--c:${c.c}"><div class="ln">${c.e} ${esc(c.n.toUpperCase())} · LEKTION ${i+1}${l.tag?` · <span style="color:${l.tag.c}">${esc(l.tag.t.toUpperCase())}</span>`:''}</div><h1>${esc(l.n)}</h1>${l.l?`<i>${esc(l.l)}</i>`:''}</div>
 <div class="player" style="--c:${c.c}"><div class="stage" id="stage"></div><div class="caption" id="cap"></div>
 <div class="ctrl"><button class="cbtn play" id="play" aria-label="Abspielen/Pause">❚❚</button><button class="cbtn" id="rst" aria-label="Neustart">↺</button><input type="range" id="rng" min="0" step="10" aria-label="Spulen"><div class="spd"><button data-s="0.5">½×</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button></div></div>
 <div class="steps" id="steps"></div></div>
 <div class="boxes">${boxes.map(b=>`<div class="box ${b[0]}"><h5>${b[1]}</h5><p>${esc(b[2])}</p></div>`).join('')}</div>
 ${l.w?`<div class="credit" style="--c:${c.c}">Foto & mehr: <a href="https://de.wikipedia.org/wiki/${encodeURIComponent(l.w.replace(/ /g,'_'))}" target="_blank" rel="noopener">Wikipedia – ${esc(l.w)} ↗</a> (Lizenz siehe Bildseite)</div>`:''}
 <div class="nav2" style="--c:${c.c}"><button ${prev?'':'disabled'} onclick="go('l-${prev?prev.id:''}')">← ${prev?'Zurück':'—'}</button><button class="nx" onclick="go('${next?'l-'+next.id:'b-'+c.id}')">${next?'Weiter: '+esc(next.n)+' →':'Zur Übersicht ✓'}</button></div>`;
 $('#main').innerHTML=h;markSeen(l.id);player=Player(l);
}

/* ---------- Quiz ---------- */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
function makeQ(){
 const types=['bild','bild','bild','gruppe','groesse','erk','rechnen','gift'];
 for(let tries=0;tries<50;tries++){
  const ty=pick(types);const s=pick(ALL);
  if(ty==='bild'||ty==='erk'){const others=shuffle(s.cat.items.filter(x=>x!==s)).slice(0,3);if(others.length<3)continue;
   return{ty,sp:s,q:ty==='bild'?'Was ist hier zu sehen?':'Welche Art passt zu dieser Beschreibung?',quote:ty==='erk'?s.erk:'',opts:shuffle([s,...others].map(x=>x.n)),a:s.n,ex:`${s.n} – ${s.erk}`}}
  if(ty==='gruppe'){const opts=shuffle([s.cat.n,...shuffle(CATS.filter(c=>c!==s.cat)).slice(0,3).map(c=>c.n)]);return{ty,sp:s,q:`Zu welcher Gruppe gehört: ${s.n}?`,opts,a:s.cat.n,ex:`${s.n} gehört zu den ${s.cat.n}. ${s.d}`}}
  if(ty==='groesse'){const f=shuffle([0.2,0.4,2.5,5]).slice(0,3);const opts=shuffle([s.s,...f.map(x=>s.s*x)].map(fmtSize));if(new Set(opts).size<4)continue;return{ty,sp:s,q:`${s.n} – ${s.sl}: Wie groß ungefähr?`,opts,a:fmtSize(s.s),ex:sizeText(s)}}
  if(ty==='gift'){const g=ALL.filter(x=>x.tag&&(x.cat.id==='pilze'||x.cat.id==='blumen'));const t=pick(g);const lab=x=>/tödlich/.test(x.tag.t)?'Tödlich giftig':/giftig/.test(x.tag.t)?'Giftig':'Essbar';
   return{ty,sp:t,q:`${t.n}: essbar oder giftig?`,opts:['Essbar','Giftig','Tödlich giftig'],a:lab(t),ex:`${t.n} ist ${t.tag.t}. ${t.tipp}`}}
  if(ty==='rechnen'){const a=pick(ALL),b=pick(ALL);if(a===b)continue;const r=a.s/b.s;if(r<3||r>200)continue;const ans=Math.round(r);
   const d=shuffle([...new Set([Math.round(ans*2),Math.max(1,Math.round(ans/2)),ans+ (ans>10?5:2),Math.max(1,ans-(ans>10?5:1))])].filter(x=>x!==ans)).slice(0,3);if(d.length<3)continue;
   return{ty,sp:a,q:`Rechenaufgabe: ${a.n} ist etwa ${fmtSize(a.s)} groß (${a.sl}), ${b.n} etwa ${fmtSize(b.s)}. Wie oft passt ${b.n} ungefähr in ${a.n}?`,opts:shuffle([ans,...d].map(x=>x+'-mal')),a:ans+'-mal',ex:`${fmtSize(a.s)} ÷ ${fmtSize(b.s)} ≈ ${fmtN(r,1)} → gerundet ${ans}-mal.`}}
 }
 const s=pick(ALL);return{ty:'gruppe',sp:s,q:`Zu welcher Gruppe gehört: ${s.n}?`,opts:shuffle(CATS.slice(0,4).map(c=>c.n).concat(CATS.slice(0,4).includes(s.cat)?[]:[s.cat.n])).slice(0,5),a:s.cat.n,ex:''};
}
let Q=null;
function renderQuizStart(){Q={qs:[],i:0,ok:0,wrong:[]};const used=new Set();while(Q.qs.length<10){const q=makeQ();const key=q.ty+q.sp.id;if(used.has(key))continue;used.add(key);Q.qs.push(q)}renderQ()}
function renderQ(){
 const q=Q.qs[Q.i];const c='#a78bfa';
 let h=head()+`<button class="back" onclick="go('start')">← Startseite</button><div class="qwrap" style="--c:${c}"><div class="qtop"><span>FRAGE ${Q.i+1} / 10</span><span>✓ ${Q.ok}</span></div><div class="qbar"><i style="width:${Q.i*10}%"></i></div>`;
 if(q.ty==='bild')h+=`<div class="qimg" id="qimg" style="--c:${q.sp.cat.c}"><div class="ph"><span class="em">⏳</span></div></div>`;
 h+=`<div class="qq" id="qq">${esc(q.q)}${q.quote?`<q>${esc(q.quote)}</q>`:''}</div><div class="opts">${q.opts.map(o=>`<button class="opt">${esc(o)}</button>`).join('')}</div><div id="fbx"></div></div>`;
 $('#main').innerHTML=h;
 if(q.ty==='bild'){getImg(q.sp.w).then(u=>{if(Q.qs[Q.i]!==q)return;const box=$('#qimg');if(!box)return;
  if(u){box.innerHTML=`<div class="ph"><img alt="" referrerpolicy="no-referrer" class="ok" src="${esc(u)}"></div>`;box.querySelector('img').onerror=()=>fallback()}else fallback();
  function fallback(){q.ty='erk';box.remove();$('#qq').innerHTML=`Welche Art passt zu dieser Beschreibung?<q>${esc(q.sp.erk)}</q>`}})}
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b));
}
function answer(b){
 const q=Q.qs[Q.i];const right=b.textContent===q.a;if(right)Q.ok++;else Q.wrong.push(q.sp);
 document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.textContent===q.a)x.classList.add('r');else if(x===b)x.classList.add('f')});
 $('#fbx').innerHTML=`<div class="fb"><b style="color:${right?'#22c55e':'#ef4444'}">${right?'✓ Richtig!':'✗ Leider falsch – richtig ist: '+esc(q.a)}</b>${esc(q.ex)}</div><div class="qact"><button onclick="go('l-${q.sp.id}')">📖 Zur Lektion</button><button class="nx" id="qn">${Q.i<9?'Nächste Frage →':'Ergebnis anzeigen'}</button></div>`;
 $('#qn').onclick=()=>{Q.i++;if(Q.i<10)renderQ();else renderResult()};
}
function renderResult(){
 const best=Math.max(LS.get('natur_best',0),Q.ok);LS.set('natur_best',best);
 const uniq=[...new Map(Q.wrong.map(s=>[s.id,s])).values()];
 const msg=Q.ok>=9?'Großartig – echter Naturprofi! 🏆':Q.ok>=6?'Gut gemacht! 🌿':'Weiter üben – du schaffst das! 💪';
 $('#main').innerHTML=head()+`<div class="qwrap" style="--c:#a78bfa;text-align:center"><div class="kicker" style="color:#a78bfa">ERGEBNIS</div><div class="score">${Q.ok}/10</div><p style="margin:8px 0 2px;font-weight:700">${msg}</p><p class="lead" style="margin:0 auto">Bestwert: ${best}/10</p>
 ${uniq.length?`<div style="text-align:left;margin-top:16px"><div class="kicker" style="color:#ef4444">ZUM WIEDERHOLEN</div><div class="rep">${uniq.map(s=>`<button onclick="go('l-${s.id}')"><span style="font-size:22px">${s.e}</span><span><b>${esc(s.n)}</b><br><small style="color:var(--mu)">${esc(s.cat.n)}</small></span></button>`).join('')}</div></div>`:''}
 <div class="qact"><button onclick="go('start')">Startseite</button><button class="nx" onclick="renderQuizStart()">Neues Quiz ↺</button></div></div>`;
}
window.renderQuizStart=renderQuizStart;

applyTheme();route();
})();
</script>
